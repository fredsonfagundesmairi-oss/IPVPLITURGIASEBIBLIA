<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montador de Liturgia e Bíblia Integrada - IPVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: white; color: black; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-indigo-700 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    ⛪ Sistema de Liturgias e Bíblia - IPVP
                </h1>
                <p class="text-indigo-200 text-sm">Igreja Presbiteriana de Várzea do Poço - BA | Pr. Fredson Fagundes</p>
            </div>
            <div class="flex gap-2">
                <button onclick="carregarLiturgiaPadrao()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">
                    Carregar Culto Padrão
                </button>
                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow flex items-center gap-2">
                    🖨️ Imprimir / PDF
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Coluna Esquerda/Centro: Construtor de Liturgia -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-900">Montador de Ordem do Culto</h2>
                    <button onclick="adicionarBloco()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                        + Adicionar Parte
                    </button>
                </div>
                <div id="lista-blocos" class="space-y-4"></div>
            </div>
        </div>

        <!-- Coluna Direita: Auxiliar Bíblico e Hinário -->
        <div class="space-y-6 no-print">
            <!-- Consulta Bíblica -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-900 mb-3">📖 Consulta Bíblica</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Versão</label>
                        <select id="versao-biblia" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="ARA">Almeida Revista e Atualizada (ARA)</option>
                            <option value="ACF">Almeida Corrigida Fiel (ACF)</option>
                            <option value="NVI">Nova Versão Internacional (NVI)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Referência</label>
                        <div class="flex gap-2">
                            <input type="text" id="ref-busca" placeholder="Ex: Salmo 11.1" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <button onclick="buscarTextoBiblico()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Buscar</button>
                        </div>
                    </div>
                    <div id="resultado-biblia" class="bg-slate-50 p-3 rounded-lg text-sm text-slate-700 min-h-[120px] max-h-[250px] overflow-y-auto border border-slate-200">
                        Digite uma referência e clique em buscar...
                    </div>
                </div>
            </div>

            <!-- Hinário -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-900 mb-3">🎵 Hinário e Cânticos</h3>
                <select id="seletor-hinos" onchange="mostrarHino()" class="w-full border border-slate-300 rounded-lg p-2 text-sm mb-3">
                    <option value="">Selecione do Hinário ou Corinhos...</option>
                </select>
                <div id="letra-hino" class="bg-slate-50 p-3 rounded-lg text-xs text-slate-700 h-[200px] overflow-y-auto border border-slate-200 whitespace-pre-line">
                    Selecione um hino acima...
                </div>
            </div>
        </div>
    </main>

    <!-- Importação dos arquivos de dados separados -->
    <script src="biblia-dados.js"></script>
    <script src="hinos-dados.js"></script>

    <script>
        function popularSeletorHinos() {
            const select = document.getElementById('seletor-hinos');
            for (let id in hinosDB) {
                let opt = document.createElement('option');
                opt.value = id;
                opt.text = hinosDB[id].titulo;
                select.appendChild(opt);
            }
        }

        function mostrarHino() {
            const chave = document.getElementById('seletor-hinos').value;
            const container = document.getElementById('letra-hino');
            if (hinosDB[chave]) {
                container.innerText = hinosDB[chave].letra;
            } else {
                container.innerText = "Selecione um hino acima para visualizar a letra.";
            }
        }

        let blocosLiturgia = [
            { titulo: "1. CHAMADA AO CULTO", texto: "Texto Bíblico: Salmo 11.1\nCântico: Venho Senhor, Minha Vida Oferecer" },
            { titulo: "2. EXALTAÇÃO – A IGREJA EM PÉ", texto: "Texto Bíblico: Salmo 111 – JUNTOS\nOração de exaltação\nHino: 336 - Transformação" },
            { titulo: "3. CONTRIÇÃO – A IGREJA SENTADA", texto: "Texto Bíblico: Efésios 4.17-23 - LITURGO\nOração de Confissão silenciosa\nPalavra da Graça: Efésios 4.23\nOração de Gratidão audível" },
            { titulo: "4. ADORAÇÃO E GRATIDÃO – A IGREJA EM PÉ", texto: "Texto Bíblico: – TODOS EM PÉ\n1. Vim Para Adorar-te\n2. Rendido Estou" },
            { titulo: "5. EDIFICAÇÃO", texto: "Exposição da Palavra\nMúsica: Renova-me" },
            { titulo: "6. AVISOS E BENÇÃO", texto: "Não haverá Reunião de Oração na quinta, nem programação no domingo." }
        ];

        function renderizarLiturgia() {
            const container = document.getElementById('lista-blocos');
            container.innerHTML = '';
            blocosLiturgia.forEach((bloco, index) => {
                container.innerHTML += `
                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 space-y-2">
                        <div class="flex justify-between items-center">
                            <input type="text" value="${bloco.titulo}" onchange="atualizarBloco(${index}, 'titulo', this.value)" class="font-bold text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none w-full">
                            <button onclick="removerBloco(${index})" class="text-red-500 hover:text-red-700 text-xs font-semibold ml-2 no-print">Remover</button>
                        </div>
                        <textarea rows="3" onchange="atualizarBloco(${index}, 'texto', this.value)" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">${bloco.texto}</textarea>
                    </div>
                `;
            });
        }

        function atualizarBloco(index, campo, valor) { blocosLiturgia[index][campo] = valor; }
        function adicionarBloco() { blocosLiturgia.push({ titulo: "NOVO ITEM", texto: "Descrição..." }); renderizarLiturgia(); }
        function removerBloco(index) { blocosLiturgia.splice(index, 1); renderizarLiturgia(); }
        function carregarLiturgiaPadrao() { renderizarLiturgia(); }

        function buscarTextoBiblico() {
            const ref = document.getElementById('ref-busca').value.trim();
            const versao = document.getElementById('versao-biblia').value;
            const container = document.getElementById('resultado-biblia');
            
            if(!ref || typeof bibliaDB === 'undefined') {
                container.innerHTML = "Base bíblica carregando ou referência inválida.";
                return;
            }

            // Pesquisa simples no banco separado
            let encontrado = bibliaDB.find(b => b.ref.toLowerCase().includes(ref.toLowerCase()));
            if (encontrado) {
                container.innerHTML = `<strong>${encontrado.ref} (${versao})</strong><br><br>${encontrado[versao] || encontrado['ARA']}`;
            } else {
                container.innerHTML = `Texto para <strong>${ref}</strong> (${versao}) pronto para uso na liturgia.`;
            }
        }

        window.onload = () => {
            renderizarLiturgia();
            popularSeletorHinos();
        };
    </script>
</body>
</html>
